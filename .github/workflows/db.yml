name: Database

# Applies every migration to a fresh database and runs the pgTAP tests in supabase/tests/.
# Only runs when something that can change the database changes, to save Actions minutes
# (the repo is private: 2,000 free minutes a month).
on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/**"
      - "lib/database.types.ts"
      - ".github/workflows/db.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/db.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

# A new push to the same PR cancels the run that's still going.
concurrency:
  group: db-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Migrations and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The stop list is valid, and the SQL seed built from it is up to date (T-1.4).
      - run: node scripts/check-landmarks.mjs
      - run: node scripts/seed-landmarks.mjs --check
      # Starts only the Postgres container, which applies every migration. The tests need
      # nothing else, and skipping the other services saves several minutes per run.
      - run: npm run db:start:db-only
      - run: npm run test:db
      # lib/database.types.ts must match the migrations, so app code type-checks against the
      # real schema. Fix with: npm run db:types
      - name: Generated database types are up to date
        run: npx supabase gen types typescript --local | diff - lib/database.types.ts
